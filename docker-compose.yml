services:
  front-risk-calculator:
    build:
      context: .
      target: dev
    command: yarn dev --hostname 0.0.0.0
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - front_node_modules:/app/node_modules

volumes:
  front_node_modules:
